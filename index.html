<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salle PS5</title>
<meta name="theme-color" content="#141b2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Salle PS5">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="brand"><div class="logo">PS5</div><div><b id="salle-nom">GAME ROOM</b><small>Gestion de salle</small></div></div>
    <nav class="nav" id="nav" aria-label="Menu principal"></nav>
    <div class="me"><div class="av" id="me-av">?</div><div><b id="me-nom"></b><span id="me-role"></span></div></div>
  </aside>
  <div class="main">
    <header class="top">
      <button class="back" id="back" hidden aria-label="Retour">‹</button>
      <div class="ttl"><h1 id="titre">Postes</h1><div class="sub" id="soustitre"></div></div>
      <div class="right" id="top-actions"></div>
    </header>
    <div class="banner" id="banner" hidden></div>
    <main class="view" id="view"></main>
  </div>
</div>

<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<div class="login" id="login" hidden>
  <div class="box">
    <div class="brand"><div class="logo">PS5</div><div><b id="login-salle">GAME ROOM</b><small>Choisissez votre compte</small></div></div>
    <div class="users" id="login-users"></div>
    <div class="pin" id="pin"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <p class="err" id="login-err" role="alert"></p>
    <div class="pad" id="pad"></div>
    <button class="lang" id="login-lang" data-notr>عربي / Français</button>
  </div>
</div>

<div class="toast" id="toast" hidden role="status"></div>

<script src="core.js"></script>
<script src="store.js"></script>
<script src="i18n.js"></script>
<script src="ui.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
